<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CredCerto — Gestão de Empréstimos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --verde-900:#07231C;
  --verde-800:#0C2E24;
  --verde-700:#0E9B76;
  --verde-600:#12B187;
  --verde-500:#3DBE96;
  --verde-100:#E1F5EE;
  --creme-50:#F5F7F3;
  --tinta-900:#0B1712;
  --tinta-600:#4C5A54;
  --tinta-400:#8B9992;
  --laranja-500:#FF8C42;
  --laranja-100:#FFEADB;
  --lilas-500:#8B6BFF;
  --lilas-100:#EDE8FF;
  --azul-500:#3E7CFF;
  --azul-100:#E4ECFF;
  --vermelho-500:#E5484D;
  --vermelho-100:#FCE3E4;
  --branco:#FFFFFF;
  --borda:#E4E9E4;
  --shadow-sm: 0 1px 2px rgba(7,35,28,.06);
  --shadow-md: 0 8px 24px rgba(7,35,28,.08);
  --shadow-lg: 0 16px 48px rgba(7,35,28,.14);
  --radius: 16px;
  --radius-sm: 10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
svg{ width:1em; height:1em; flex-shrink:0; vertical-align:-0.15em; }
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--creme-50);
  color:var(--tinta-900);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{ font-family:'Sora',sans-serif; letter-spacing:-0.02em; }
.mono{ font-family:'JetBrains Mono',monospace; font-variant-numeric: tabular-nums; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input,select,textarea{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--verde-100); }
:focus-visible{ outline:2px solid var(--verde-600); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ============ SHELL LAYOUT ============ */
.app-shell{
  display:grid;
  grid-template-columns: 248px 1fr;
  min-height:100vh;
}
.sidebar{
  background: linear-gradient(180deg, var(--verde-900), #051912 85%);
  color:#fff;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  gap:6px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 10px 26px 10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--verde-500),var(--verde-700));
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;color:#052018;font-size:16px;
  box-shadow: 0 4px 14px rgba(18,177,135,.4);
}
.brand-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; color:#fff;}
.brand-sub{ font-size:10.5px; color:rgba(255,255,255,.5); letter-spacing:.04em; text-transform:uppercase;}

.nav-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:rgba(255,255,255,.35); padding:16px 12px 6px;
  font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:10px;
  color:rgba(255,255,255,.72);
  font-size:14px; font-weight:500;
  transition: background .15s ease, color .15s ease;
  position:relative;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:.9;}
.nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav-item.active{ background:rgba(61,190,150,.16); color:#fff; }
.nav-item.active::before{
  content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:3px;
  background:var(--verde-500); border-radius:0 4px 4px 0;
}
.nav-badge{
  margin-left:auto; background:var(--laranja-500); color:#2b1400;
  font-size:10px; font-weight:700; padding:1px 6px; border-radius:20px;
}
.sidebar-footer{
  margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:10px;
}
.avatar-sm{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--lilas-500),var(--azul-500));
  display:flex;align-items:center;justify-content:center;
  font-size:12px; font-weight:700; color:#fff;
}
.sidebar-footer-name{ font-size:13px; font-weight:600; color:#fff; }
.sidebar-footer-role{ font-size:11px; color:rgba(255,255,255,.45); }

.main{ padding:28px 34px 100px; max-width:1320px; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:26px; gap:16px; flex-wrap:wrap;
}
.page-title{ font-size:24px; font-weight:700; }
.page-sub{ font-size:13.5px; color:var(--tinta-600); margin-top:2px; }
.topbar-actions{ display:flex; gap:10px; align-items:center; }
.search-box{
  display:flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--borda); border-radius:12px;
  padding:9px 14px; min-width:220px;
}
.search-box input{ border:none; outline:none; font-size:13.5px; width:100%; background:transparent; }
.search-box svg{ width:16px;height:16px; color:var(--tinta-400); flex-shrink:0;}

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 16px; border-radius:12px;
  font-size:13.5px; font-weight:600;
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn svg{ width:16px; height:16px; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--verde-700); color:#fff; box-shadow:0 6px 16px rgba(14,155,118,.28);}
.btn-primary:hover{ background:var(--verde-600); }
.btn-ghost{ background:#fff; color:var(--tinta-900); border:1px solid var(--borda); }
.btn-ghost:hover{ background:var(--creme-50); }
.btn-danger-ghost{ background:var(--vermelho-100); color:var(--vermelho-500); }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:9px;}
.btn-icon{ width:36px;height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--borda);}
.btn-icon svg{ width:16px; height:16px; }
.btn-icon:hover{ background:var(--creme-50); }

/* ============ CARDS / KPI ============ */
.grid{ display:grid; gap:18px; }
.kpi-grid{ grid-template-columns: repeat(4, 1fr); margin-bottom:22px; }
.card{
  background:#fff; border-radius:var(--radius); padding:20px;
  border:1px solid var(--borda); box-shadow: var(--shadow-sm);
}
.kpi-card{ position:relative; overflow:hidden; }
.kpi-icon{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center; margin-bottom:14px;
}
.kpi-icon svg{ width:19px;height:19px; }
.kpi-label{ font-size:12.5px; color:var(--tinta-600); font-weight:600; margin-bottom:6px;}
.kpi-value{ font-size:23px; font-weight:700; font-family:'Sora',sans-serif; letter-spacing:-0.01em;}
.kpi-delta{ font-size:11.5px; margin-top:8px; font-weight:600; display:flex; align-items:center; gap:4px;}
.delta-up{ color:var(--verde-700); }
.delta-down{ color:var(--vermelho-500); }

.section-title{ font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.two-col{ grid-template-columns: 1.4fr 1fr; align-items:start;}

/* progress ring */
.ring-wrap{ position:relative; width:112px; height:112px; margin:0 auto;}
.ring-wrap svg{ width:112px; height:112px; transform:rotate(-90deg); }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-center .val{ font-size:19px; font-weight:800; font-family:'Sora',sans-serif; }
.ring-center .lbl{ font-size:9.5px; color:var(--tinta-600); text-transform:uppercase; letter-spacing:.05em;}

/* tables */
.table-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--borda); background:#fff;}
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
thead th{
  text-align:left; padding:12px 16px; font-size:11px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--tinta-600); background:var(--creme-50);
  border-bottom:1px solid var(--borda); font-weight:700; white-space:nowrap;
}
tbody td{ padding:13px 16px; border-bottom:1px solid var(--borda); vertical-align:middle;}
tbody tr:last-child td{ border-bottom:none; }
tbody tr{ transition:background .12s; }
tbody tr:hover{ background:var(--creme-50); }
.cell-name{ font-weight:600; display:flex; align-items:center; gap:10px;}
.avatar-tiny{
  width:30px;height:30px;border-radius:50%; flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px; font-weight:700; color:#fff;
}
.presence-dot{
  position:absolute; bottom:-1px; right:-1px; width:9px; height:9px; border-radius:50%;
  border:2px solid #fff; box-sizing:content-box;
}
.presence-online{ background:var(--verde-600); }
.presence-offline{ background:var(--tinta-400); }
@keyframes presencePulse{ 0%{ box-shadow:0 0 0 0 rgba(18,177,135,.45);} 100%{ box-shadow:0 0 0 6px rgba(18,177,135,0);} }
.presence-pulse{ animation: presencePulse 1.6s ease-out infinite; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-dot{ width:6px;height:6px;border-radius:50%;}
.badge-ok{ background:var(--verde-100); color:var(--verde-700);}
.badge-ok .badge-dot{ background:var(--verde-600);}
.badge-warn{ background:var(--laranja-100); color:#b95c00;}
.badge-warn .badge-dot{ background:var(--laranja-500);}
.badge-bad{ background:var(--vermelho-100); color:var(--vermelho-500);}
.badge-bad .badge-dot{ background:var(--vermelho-500);}
.badge-info{ background:var(--azul-100); color:var(--azul-500);}
.badge-info .badge-dot{ background:var(--azul-500);}
.badge-neutral{ background:var(--creme-50); color:var(--tinta-600); border:1px solid var(--borda);}

.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.chip{
  padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600;
  background:#fff; border:1px solid var(--borda); color:var(--tinta-600);
  transition:all .15s;
}
.chip.active{ background:var(--verde-900); color:#fff; border-color:var(--verde-900); }

/* ============ CLIENT CARDS GRID (mobile-app style) ============ */
.client-cards{ grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); }
.client-card{
  background:#fff; border-radius:var(--radius); border:1px solid var(--borda);
  padding:18px; box-shadow:var(--shadow-sm); transition: box-shadow .15s, transform .15s; cursor:pointer;
}
.client-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
.client-card-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.client-card-name{ font-weight:700; font-size:14.5px;}
.client-card-id{ font-size:11.5px; color:var(--tinta-600);}
.client-card-bar{ height:6px; border-radius:6px; background:var(--creme-50); overflow:hidden; margin:10px 0 8px;}
.client-card-bar-fill{ height:100%; background:linear-gradient(90deg,var(--verde-500),var(--verde-700)); border-radius:6px;}
.client-card-nums{ display:flex; justify-content:space-between; font-size:12px; color:var(--tinta-600);}
.client-card-nums b{ color:var(--tinta-900); font-family:'JetBrains Mono',monospace;}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(7,20,16,.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{
  background:#fff; border-radius:20px; width:100%; max-width:520px;
  max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
  animation: modalIn .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes modalIn{ from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:none} }
.modal-header{ padding:20px 22px; border-bottom:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between;}
.modal-title{ font-size:16.5px; font-weight:700;}
.modal-close{ width:30px;height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--tinta-600);}
.modal-close:hover{ background:var(--creme-50); }
.modal-body{ padding:22px; }
.modal-footer{ padding:16px 22px; border-top:1px solid var(--borda); display:flex; justify-content:flex-end; gap:10px;}

.form-divider{
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--verde-700); margin:22px 0 12px; padding-top:16px; border-top:1px solid var(--borda);
  display:flex; align-items:center; gap:6px;
}
.form-divider svg{ width:14px; height:14px; }
.form-divider:first-child{ margin-top:0; padding-top:0; border-top:none; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--tinta-700,#334); }
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--borda); border-radius:10px;
  font-size:13.5px; outline:none; transition:border-color .12s; background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--verde-600); box-shadow:0 0 0 3px var(--verde-100);}
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field-hint{ font-size:11.5px; color:var(--tinta-400); margin-top:4px; }
.seg{ display:flex; background:var(--creme-50); border-radius:10px; padding:3px; border:1px solid var(--borda);}
.seg button{ flex:1; padding:8px; border-radius:8px; font-size:12px; font-weight:600; color:var(--tinta-600);}
.seg button.active{ background:#fff; color:var(--verde-700); box-shadow:var(--shadow-sm);}

/* ============ COBRANÇA RÁPIDA (signature element) ============ */
.tap-flow{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:6px 0 0;}
.tap-dots{ display:flex; gap:8px; margin-bottom:22px;}
.tap-dot{ width:34px; height:5px; border-radius:6px; background:var(--borda); transition:background .2s;}
.tap-dot.done{ background:var(--verde-600); }
.tap-dot.current{ background:var(--verde-300,#9fe0c9); }
.tap-avatar{
  width:76px;height:76px;border-radius:50%; margin-bottom:14px;
  display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff;
}
.tap-amount{ font-family:'Sora',sans-serif; font-size:34px; font-weight:800; margin:10px 0 4px; }
.tap-sub{ font-size:13px; color:var(--tinta-600); margin-bottom:22px;}
.tap-btn{
  width:100%; padding:16px; border-radius:14px; background:var(--verde-700); color:#fff;
  font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 8px 22px rgba(14,155,118,.32);
}
.tap-btn:active{ transform:scale(.98); }
.tap-btn.secondary{ background:#fff; color:var(--tinta-900); border:1px solid var(--borda); box-shadow:none; margin-top:10px;}
.tap-methods{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; width:100%; margin-bottom:18px;}
.tap-method{ padding:14px 8px; border-radius:12px; border:1.5px solid var(--borda); font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:6px;}
.tap-method svg{ width:20px; height:20px; color:var(--tinta-600);}
.tap-method.active{ border-color:var(--verde-600); background:var(--verde-100); color:var(--verde-700);}
.tap-method.active svg{ color:var(--verde-700);}
.tap-success{ width:76px;height:76px;border-radius:50%; background:var(--verde-100); display:flex; align-items:center; justify-content:center; margin-bottom:16px; animation:pop .35s cubic-bezier(.3,1.5,.5,1);}
@keyframes pop{ from{transform:scale(0)} to{transform:scale(1)} }
.tap-success svg{ width:36px;height:36px; color:var(--verde-700);}

/* ============ RECEIPT ============ */
.receipt{
  background:#fff; border:1.5px dashed var(--borda); border-radius:14px; padding:22px;
  max-width:340px; margin:0 auto; font-size:12.5px;
}
.receipt-logo{ text-align:center; margin-bottom:6px; font-family:'Sora',sans-serif; font-weight:800; font-size:16px; color:var(--verde-700);}
.receipt-sub{ text-align:center; color:var(--tinta-600); font-size:11px; margin-bottom:16px;}
.receipt-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--borda);}
.receipt-row.total{ font-weight:800; font-size:14.5px; border-bottom:none; border-top:1.5px solid var(--tinta-900); margin-top:6px; padding-top:10px;}
.receipt-sign{ margin-top:26px; border-top:1px solid var(--tinta-900); padding-top:6px; text-align:center; font-size:10.5px; color:var(--tinta-600);}

/* ============ ROUTES ============ */
.route-card{ background:#fff; border:1px solid var(--borda); border-radius:var(--radius); padding:18px; }
.route-collector{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.route-stop{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--borda);}
.route-stop:last-child{ border-bottom:none;}
.route-stop-num{ width:22px;height:22px;border-radius:50%; background:var(--creme-50); border:1px solid var(--borda); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:var(--tinta-600); flex-shrink:0;}

/* ============ EMPTY STATE ============ */
.empty-state{ text-align:center; padding:60px 20px; color:var(--tinta-600);}
.empty-state svg{ width:52px;height:52px; color:var(--borda); margin-bottom:14px;}
.empty-state h3{ font-size:15px; color:var(--tinta-900); margin-bottom:6px;}
.empty-state p{ font-size:13px; max-width:320px; margin:0 auto 18px;}

/* ============ TOAST ============ */
.toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:400; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--verde-900); color:#fff; padding:13px 18px; border-radius:12px;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;
  box-shadow:var(--shadow-lg); animation: toastIn .2s ease;
  min-width:240px; max-width:380px;
}
.toast svg{ width:17px;height:17px; color:var(--verde-500); flex-shrink:0;}
.toast-erro{ background:var(--vermelho-500) !important; align-items:flex-start; }
.toast-erro svg{ color:#fff !important; margin-top:1px; }
@keyframes toastIn{ from{opacity:0; transform:translateX(20px)} to{opacity:1; transform:none} }

/* ============ AUTH SCREEN ============ */
.auth-shell{ min-height:100vh; display:grid; grid-template-columns: 1fr 440px; }
.auth-visual{
  background: linear-gradient(150deg, var(--verde-900), #051912 85%);
  padding:60px; display:flex; flex-direction:column; justify-content:center;
  position:relative; overflow:hidden;
}
.auth-blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; }
.auth-blob-1{ width:380px; height:380px; background:var(--verde-500); top:-100px; right:-100px; }
.auth-blob-2{ width:300px; height:300px; background:var(--azul-500); bottom:-80px; left:-60px; }
.auth-panel{ background:#fff; display:flex; align-items:center; justify-content:center; padding:40px 32px; }
.auth-card{ width:100%; max-width:360px; }
.auth-tabs{ display:flex; background:var(--creme-50); border-radius:12px; padding:4px; margin-bottom:20px; border:1px solid var(--borda); }
.auth-tab{ flex:1; padding:10px; border-radius:9px; font-size:13.5px; font-weight:700; color:var(--tinta-600); transition:all .15s; }
.auth-tab.active{ background:#fff; color:var(--verde-700); box-shadow:var(--shadow-sm); }
.auth-divider{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--tinta-400); font-size:12px; }
.auth-divider::before,.auth-divider::after{ content:''; flex:1; height:1px; background:var(--borda); }
.btn-google{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:11px; border-radius:12px; border:1px solid var(--borda); background:#fff;

<body>

<div id="app"></div>
<div class="toast-wrap no-print" id="toastWrap"></div>

<script>
/* ==================================================================================
   CREDCERTO — Sistema de Gestão de Empréstimos
================================================================================== */

/* ============================================================================
   FIREBASE — CONFIGURAÇÃO
   1) Crie o projeto em console.firebase.google.com
   2) Ative Authentication → Sign-in method → E-mail/senha e Google
   3) Crie o Firestore Database (modo produção)
   4) Cole as credenciais do seu app web abaixo, substituindo os valores "COLE_AQUI..."
   5) Publique as regras de segurança (veja o guia que te passei) em Firestore → Regras
   Enquanto os valores abaixo não forem preenchidos, o CredCerto roda em MODO DEMO
   (dados de exemplo em memória, sem persistência real) — nada quebra, é só um preview.
============================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI",
};
const FIREBASE_ATIVO = !!(FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('COLE_AQUI'));

let fbApp = null, fbAuth = null, fbDb = null, fbFunctions = null;
if(FIREBASE_ATIVO){
  try{
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbFunctions = firebase.functions();
  }catch(e){ console.error('Falha ao iniciar Firebase:', e); }
}

/* ---- Helpers genéricos de Firestore (só chamam a rede quando FIREBASE_ATIVO) ---- */
async function fbAdd(colecao, dado){
  if(!FIREBASE_ATIVO) return null;
  try{ const ref = await fbDb.collection(colecao).add(dado); return ref.id; }
  catch(e){ console.error('fbAdd', colecao, e); toastErro('Não salvou "'+colecao+'" no servidor: '+(e.code||e.message||'erro desconhecido')); return null; }
}
async function fbSet(colecao, id, dado){
  if(!FIREBASE_ATIVO) return;
  try{ await fbDb.collection(colecao).doc(id).set(dado, {merge:true}); }
  catch(e){ console.error('fbSet', colecao, id, e); toastErro('Não salvou "'+colecao+'" no servidor: '+(e.code||e.message||'erro desconhecido')); }
}
async function fbUpdate(colecao, id, dado){
  if(!FIREBASE_ATIVO) return;
  try{ await fbDb.collection(colecao).doc(id).update(dado); }
  catch(e){ console.error('fbUpdate', colecao, id, e); toastErro('Não atualizou "'+colecao+'" no servidor: '+(e.code||e.message||'erro desconhecido')); }
}
async function fbDelete(colecao, id){
  if(!FIREBASE_ATIVO) return;
  try{ await fbDb.collection(colecao).doc(id).delete(); }
  catch(e){ console.error('fbDelete', colecao, id, e); toastErro('Não excluiu de "'+colecao+'" no servidor: '+(e.code||e.message||'erro desconhecido')); }
}

/* ---- Sincronização em tempo real: espelha as coleções do Firestore em db.* ---- */
let _fbUnsubs = [];
function safeRender(){ if(!state.modal) render(); } // evita apagar formulário aberto quando chega uma atualização
function iniciarSincroniaFirestore(){
  if(!FIREBASE_ATIVO) return;
  pararSincroniaFirestore();
  ['usuarios','clientes','emprestimos','pagamentos','carteiras','cobradores'].forEach(colecao=>{
    const unsub = fbDb.collection(colecao).onSnapshot(snap=>{
      // Importante: NÃO capturar o array por referência aqui fora — várias telas do
      // app fazem "db.x = db.x.filter(...)" (reatribuição) em vez de mutar o array
      // existente. Se a referência fosse capturada uma vez, a sincronia em tempo real
      // "descolava" do array real depois da primeira exclusão. Por isso buscamos
      // db[colecao] de novo a cada snapshot, sempre pegando o array atual.
      const arr = db[colecao];
      arr.length = 0;
      snap.forEach(doc=> arr.push({id:doc.id, ...doc.data()}));
      safeRender();
    }, err=>{
      console.error('onSnapshot', colecao, err);
      toastErro('Não consegui sincronizar "'+colecao+'" com o Firebase ('+(err.code||err.message||'erro')+'). Confira as regras do Firestore.');
    });
    _fbUnsubs.push(unsub);
  });
}
function pararSincroniaFirestore(){
  _fbUnsubs.forEach(u=>u());
  _fbUnsubs = [];
}

/* ---- Autenticação real via Firebase (só usada quando FIREBASE_ATIVO) ---- */
function traduzErroFirebase(e){
  const map = {
    'auth/user-not-found':'Não encontramos uma conta com este e-mail.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/invalid-login-credentials':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com este e-mail.',
    'auth/weak-password':'A senha deve ter ao menos 6 caracteres.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/popup-closed-by-user':'Login com Google cancelado.',
    'auth/network-request-failed':'Falha de conexão. Verifique sua internet.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco antes de tentar de novo.',
  };
  return map[e.code] || ('Não foi possível continuar: '+(e.message||'tente novamente.'));
}

async function processarLoginFirebase(fbUser){
  const ref = fbDb.collection('usuarios').doc(fbUser.uid);
  let snap = await ref.get();
  if(!snap.exists){
    const ehGoogle = fbUser.providerData.some(p=>p.providerId==='google.com');
    await ref.set({
      nome: fbUser.displayName || (fbUser.email||'').split('@')[0],
      email: fbUser.email, senha:null, viaGoogle: ehGoogle,
      perfil:'Cobrador', cobradorId:null, acessoTodasCarteiras:false, carteiraIds:[],
      ativo:true, aprovado:false,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      ultimoAcesso: firebase.firestore.FieldValue.serverTimestamp(),
    });
    snap = await ref.get();
  }
  const perfil = { id: fbUser.uid, ...snap.data() };
  if(!perfil.aprovado){
    await fbAuth.signOut();
    state.authPendingNome = perfil.nome; state.authMode='pending'; state.authError='';
    render();
    return;
  }
  if(!perfil.ativo){
    await fbAuth.signOut();
    state.authError = 'Este usuário está desativado. Fale com um administrador.';
    render();
    return;
  }
  await ref.update({ ultimoAcesso: firebase.firestore.FieldValue.serverTimestamp() });
  state.session = { userId: fbUser.uid };
  state.currentUserId = fbUser.uid;
  state.authError=''; state.authDraft={};
  iniciarSincroniaFirestore();
  iniciarPresenca();
  render();
  toast('Bem-vindo, '+perfil.nome+'!', ICONS.check);
}

async function fbFazerLogin(email, senha){
  try{
    const cred = await fbAuth.signInWithEmailAndPassword(email, senha);
    await processarLoginFirebase(cred.user);
  }catch(e){
    state.authError = traduzErroFirebase(e);
    render();
  }
}

async function fbCriarConta(nome, email, senha){
  try{
    const cred = await fbAuth.createUserWithEmailAndPassword(email, senha);
    await cred.user.updateProfile({displayName: nome});
    await fbDb.collection('usuarios').doc(cred.user.uid).set({
      nome, email, senha:null, viaGoogle:false, perfil:'Cobrador', cobradorId:null,
      acessoTodasCarteiras:false, carteiraIds:[], ativo:true, aprovado:false,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      ultimoAcesso: null,
    });
    await fbAuth.signOut();
    state.authPendingNome = nome; state.authMode='pending'; state.authError=''; state.authDraft={};
    render();
  }catch(e){
    state.authError = traduzErroFirebase(e);
    render();
  }
}

async function fbEntrarGoogle(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const cred = await fbAuth.signInWithPopup(provider);
    await processarLoginFirebase(cred.user);
  }catch(e){
    state.authError = traduzErroFirebase(e);
    render();
  }
}

async function fbSairSessao(){
  pararPresenca();
  pararSincroniaFirestore();
  try{ await fbAuth.signOut(); }catch(e){ console.error(e); }
  state.session = null; state.modal = null; state.authMode = 'login';
  state.authDraft = {}; state.authError='';
  db.clientes.length=0; db.emprestimos.length=0; db.pagamentos.length=0;
  db.usuarios.length=0; db.carteiras.length=0; db.cobradores.length=0;
  render();
}

/* ---- Cloud Functions (Admin SDK) — criação/exclusão de usuário pelo admin ----
   Exige que as functions do arquivo functions/index.js estejam publicadas
   (firebase deploy --only functions). Se ainda não estiverem, cai no aviso
   orientando a pessoa a se autocadastrar. */
async function fbCriarUsuarioAdmin(dados){
  try{
    const chamar = fbFunctions.httpsCallable('criarUsuarioAdmin');
    await chamar(dados);
    toast('Usuário '+dados.nome+' criado e já aprovado');
    closeModal(); navigate('usuarios');
  }catch(e){
    console.error(e);
    if(e.code==='functions/not-found' || e.code==='not-found'){
      toast('A função criarUsuarioAdmin ainda não foi publicada (firebase deploy --only functions). Por ora, peça para a pessoa se cadastrar em "Criar conta" e aprove aqui.', ICONS.alert);
    } else {
      toast(e.message || 'Não foi possível criar o usuário', ICONS.alert);
    }
  }
}
async function fbExcluirUsuarioAdmin(uid, nome){
  try{
    const chamar = fbFunctions.httpsCallable('excluirUsuarioAdmin');
    await chamar({uid});
    toast('Usuário '+nome+' excluído (perfil e login removidos)');
  }catch(e){
    console.error(e);
    // fallback: a function pode não estar publicada ainda — ao menos remove o perfil
    if(FIREBASE_ATIVO) fbDelete('usuarios', uid);
    db.usuarios = db.usuarios.filter(x=>x.id!==uid);
    toast('Perfil excluído. A conta de login só será removida quando a Cloud Function estiver publicada.', ICONS.alert);
    render();
  }
}

  if(!v) return null;
  if(typeof v.toMillis === 'function') return v.toMillis();
  if(typeof v.toDate === 'function') return v.toDate().getTime();
  const ms = new Date(v).getTime();
  return isNaN(ms) ? null : ms;
}

/* ---------------- MOTOR DE CÁLCULO DE JUROS ---------------- */
const FREQ_DIAS = { diario:1, semanal:7, quinzenal:15, mensal:30 };
const FREQ_LABEL = { diario:'Diária', semanal:'Semanal', quinzenal:'Quinzenal', mensal:'Mensal' };
const MODO_LABEL = { fixo:'Juros Fixo', recalculado:'Recalculado (saldo devedor)', capitalizacao:'Capitalização Bancária' };

function gerarCronograma({capital, taxaMensal, prazoDias, frequencia, modo, dataInicio}){
  const freqDias = FREQ_DIAS[frequencia];
  const n = Math.max(1, Math.round(prazoDias/freqDias));
  const i = (taxaMensal/100) * (freqDias/30); // taxa periódica
  const parcelas = [];
  let saldo = capital;

  if(modo==='fixo'){
    const jurosTotal = capital * i * n;
    const parcelaValor = (capital + jurosTotal)/n;
    for(let k=1;k<=n;k++){
      parcelas.push({
        id:uid('parc'), numero:k, dataVencimento: addDays(dataInicio, freqDias*k),
        valor: round2(parcelaValor), juros: round2(parcelaValor - capital/n), amortizacao: round2(capital/n),
        status:'pendente', pago:0, dataPagamento:null, meio:null,
      });
    }
  } else if(modo==='recalculado'){
    const amort = capital/n;
    for(let k=1;k<=n;k++){
      const juros = saldo*i;
      const valor = amort + juros;
      parcelas.push({
        id:uid('parc'), numero:k, dataVencimento: addDays(dataInicio, freqDias*k),
        valor: round2(valor), juros: round2(juros), amortizacao: round2(amort),
        status:'pendente', pago:0, dataPagamento:null, meio:null,
      });
      saldo -= amort;
    }
  } else { // capitalizacao (Price)
    const pmt = i===0 ? capital/n : capital*(i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1);
    for(let k=1;k<=n;k++){
      const juros = saldo*i;
      const amort = pmt-juros;
      parcelas.push({
        id:uid('parc'), numero:k, dataVencimento: addDays(dataInicio, freqDias*k),
        valor: round2(pmt), juros: round2(juros), amortizacao: round2(amort),
        status:'pendente', pago:0, dataPagamento:null, meio:null,
      });
      saldo -= amort;
    }
  }
  return parcelas;
}
function round2(v){ return Math.round(v*100)/100; }

function criarEmprestimo(data, opts={}){
  const parcelas = gerarCronograma(data);
  const emp = {
    id: uid('emp'),
    clienteId: data.clienteId,
    capital: data.capital,
    taxaMensal: data.taxaMensal,
    prazoDias: data.prazoDias,
    frequencia: data.frequencia,
    modo: data.modo,
    dataInicio: data.dataInicio,
    jurosAtrasoMensal: data.jurosAtrasoMensal!==undefined ? data.jurosAtrasoMensal : 30,
    status:'ativo',
    parcelas,
  };
  db.emprestimos.push(emp);
  if(FIREBASE_ATIVO) fbSet('emprestimos', emp.id, emp);
  if(!opts.silent) toast('Empréstimo criado com sucesso', ICONS.check);
  return emp;
}

/* Cronograma "cadastro rápido de cliente": parcela = (capital/qtd) + (capital * juros%),
   conforme fórmula solicitada — juros calculado sobre o valor contratado, não sobre saldo. */
function gerarCronogramaCadastro({capital, jurosPct, qtdParcelas, frequencia, dataInicio}){
  const freqDias = FREQ_DIAS[frequencia];
  const n = Math.max(1, qtdParcelas);
  const amortizacao = capital/n;
  const jurosPorParcela = round2(capital * (jurosPct/100));
  const valorParcela = round2(amortizacao + jurosPorParcela);
  const parcelas = [];
  for(let k=1;k<=n;k++){
    parcelas.push({
      id:uid('parc'), numero:k, dataVencimento: addDays(dataInicio, freqDias*k),
      valor: valorParcela, juros: jurosPorParcela, amortizacao: round2(amortizacao),
      status:'pendente', pago:0, dataPagamento:null, meio:null,
    });
  }
  return parcelas;
}
function criarEmprestimoDoCadastro(data, opts={}){
  const parcelas = gerarCronogramaCadastro(data);
  const emp = {
    id: uid('emp'),
    clienteId: data.clienteId,
    capital: data.capital,
    taxaMensal: data.jurosPct,
    prazoDias: FREQ_DIAS[data.frequencia] * data.qtdParcelas,
    frequencia: data.frequencia,
    modo: 'fixo',
    dataInicio: data.dataInicio,
    jurosAtrasoMensal: data.jurosAtrasoMensal!==undefined ? data.jurosAtrasoMensal : 30,
    status:'ativo',
    parcelas,
  };
  db.emprestimos.push(emp);
  if(FIREBASE_ATIVO) fbSet('emprestimos', emp.id, emp);
  if(!opts.silent) toast('Empréstimo criado com sucesso', ICONS.check);
  return emp;
}

function saldoDevedor(emp){
  return emp.parcelas.filter(p=>p.status!=='pago').reduce((s,p)=>s+(p.valor-p.pago),0);
}
function capitalPendente(emp){
  return emp.parcelas.filter(p=>p.status!=='pago').reduce((s,p)=>s+p.amortizacao,0);
}
function jurosAcumulado(emp){
  return emp.parcelas.filter(p=>p.status!=='pago').reduce((s,p)=>s+p.juros,0);
}
function proximaParcela(emp){
  return emp.parcelas.find(p=>p.status!=='pago');
}
function progressoEmprestimo(emp){
  const pago = emp.parcelas.reduce((s,p)=>s+p.pago,0);
  const total = emp.parcelas.reduce((s,p)=>s+p.valor,0);
  return total? (pago/total*100) : 0;
}
function parcelasAtrasadas(emp){
  const hoje = new Date();
  return emp.parcelas.filter(p=> p.status!=='pago' && new Date(p.dataVencimento) < hoje);
}

function registrarPagamento(emprestimoId, parcelaId, valorPago, opts={}){
  const emp = db.emprestimos.find(e=>e.id===emprestimoId);
  const parcela = emp.parcelas.find(p=>p.id===parcelaId);
  if(!parcela) return;
  parcela.pago += valorPago;
  parcela.dataPagamento = todayISO();
  parcela.meio = opts.meio || 'dinheiro';
  if(parcela.pago >= parcela.valor - 0.009){ parcela.status='pago'; }
  else { parcela.status='parcial'; }

  const pagamento = {
    id: uid('pag'), emprestimoId, parcelaId, clienteId: emp.clienteId,
    valor: valorPago, data: todayISO(), meio: parcela.meio,
  };
  db.pagamentos.push(pagamento);

  if(emp.parcelas.every(p=>p.status==='pago')) emp.status='quitado';
  if(FIREBASE_ATIVO){ fbSet('pagamentos', pagamento.id, pagamento); fbSet('emprestimos', emp.id, emp); }
  if(!opts.silent) toast('Pagamento de '+fmtMoney(valorPago)+' registrado', ICONS.check);
  return pagamento;
}

function aplicarPagamentoExtra(emprestimoId, valorExtra){
  const emp = db.emprestimos.find(e=>e.id===emprestimoId);
  if(!emp) return;
  const pendentes = emp.parcelas.filter(p=>p.status!=='pago');
  if(!pendentes.length) return;
  const novoSaldo = Math.max(0, saldoDevedorCapital(emp) - valorExtra);

  const pagamentoExtra = {id:uid('pag'), emprestimoId, parcelaId:null, clienteId:emp.clienteId, valor:valorExtra, data:todayISO(), meio:'abatimento_extra'};
  db.pagamentos.push(pagamentoExtra);
  if(FIREBASE_ATIVO) fbSet('pagamentos', pagamentoExtra.id, pagamentoExtra);

  // recalcula parcelas futuras a partir do novo capital pendente
  const restante = pendentes.length;
  const freqDias = FREQ_DIAS[emp.frequencia];
  const i = (emp.taxaMensal/100)*(freqDias/30);
  let saldo = novoSaldo;

  if(emp.modo==='fixo'){
    const jurosTotal = saldo*i*restante;
    const parcelaValor = restante? (saldo+jurosTotal)/restante : 0;
    pendentes.forEach(p=>{
      p.valor = round2(parcelaValor); p.amortizacao = round2(saldo/restante); p.juros = round2(parcelaValor - saldo/restante);
      p.status='pendente'; p.pago=0;
    });
  } else if(emp.modo==='recalculado'){
    const amort = restante? saldo/restante : 0;
    pendentes.forEach(p=>{
      const juros = saldo*i; const valor = amort+juros;
      p.valor=round2(valor); p.juros=round2(juros); p.amortizacao=round2(amort);
      p.status='pendente'; p.pago=0;
      saldo -= amort;
    });
  } else {
    const n = restante;
    const pmt = (n===0||i===0) ? saldo/(n||1) : saldo*(i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1);
    pendentes.forEach(p=>{
      const juros=saldo*i, amort=pmt-juros;
      p.valor=round2(pmt); p.juros=round2(juros); p.amortizacao=round2(amort);
      p.status='pendente'; p.pago=0;
      saldo -= amort;
    });
  }
  toast('Capital abatido em '+fmtMoney(valorExtra)+' — parcelas recalculadas', ICONS.check);
  if(FIREBASE_ATIVO) fbSet('emprestimos', emp.id, emp);
}
function saldoDevedorCapital(emp){
  return emp.parcelas.filter(p=>p.status!=='pago').reduce((s,p)=>s+p.amortizacao,0);
}

/* ---------------- PRESENÇA ONLINE ---------------- */
let _heartbeatInterval = null;
let _presenceSimInterval = null;
function iniciarPresenca(){
  pararPresenca();
  if(FIREBASE_ATIVO){
    const enviarPing = ()=>{
      if(fbAuth.currentUser){
        fbDb.collection('usuarios').doc(fbAuth.currentUser.uid)
          .update({ ultimoPing: firebase.firestore.FieldValue.serverTimestamp() })
          .catch(e=>console.error('heartbeat', e));
      }
    };
    enviarPing();
    _heartbeatInterval = setInterval(enviarPing, 20000);
    return;
  }
  _heartbeatInterval = setInterval(()=>{
    const u = currentUser();
    if(u && state.session){
      u.online = true;
      u.ultimoAcesso = todayISO();
      if((state.page==='usuarios' && !state.modal) || (state.modal && state.modal.name==='trocarUsuario')) render();
    }
  }, 10000);
  // Simulação de presença dos demais usuários de exemplo — apenas para fins de demonstração,
  // já que este protótipo roda em modo demo (sem Firebase configurado) e não tem sessões reais de outros usuários.
  // Com o Firebase ativo (acima), isso vira um heartbeat real gravado por cada sessão no Firestore.
  _presenceSimInterval = setInterval(()=>{
    let mudou = false;
    db.usuarios.forEach(u=>{
      if(state.session && u.id===state.currentUserId) return;
      const estavaOnline = !!u.online;
      u.online = Math.random() < 0.55;
      if(u.online && !estavaOnline) u.ultimoAcesso = todayISO();
      if(u.online!==estavaOnline) mudou = true;
    });
    if(mudou && ((state.page==='usuarios' && !state.modal) || (state.modal && state.modal.name==='trocarUsuario'))) render();
  }, 12000);
}
function pararPresenca(){
  if(_heartbeatInterval){ clearInterval(_heartbeatInterval); _heartbeatInterval=null; }
  if(_presenceSimInterval){ clearInterval(_presenceSimInterval); _presenceSimInterval=null; }
}
function estaOnline(u){
  if(FIREBASE_ATIVO){
    const ms = toMillisSafe(u.ultimoPing);
    return ms!==null && (Date.now()-ms) < 60000;
  }
  return !!u.online;
}
function statusPresenca(u){
  if(estaOnline(u)) return { texto:'Online agora', classe:'badge-ok' };
  const refCampo = FIREBASE_ATIVO ? u.ultimoPing : u.ultimoAcesso;
  const ms = toMillisSafe(refCampo || u.ultimoAcesso);
  if(ms===null) return { texto:'Nunca acessou', classe:'badge-neutral' };
  const diffMin = Math.round((Date.now() - ms)/60000);
  if(diffMin<1) return { texto:'Visto agora há pouco', classe:'badge-neutral' };
  if(diffMin<60) return { texto:'Visto há '+diffMin+' min', classe:'badge-neutral' };
  const diffH = Math.round(diffMin/60);
  if(diffH<24) return { texto:'Visto há '+diffH+'h', classe:'badge-neutral' };
  return { texto:'Visto há '+Math.round(diffH/24)+'d', classe:'badge-neutral' };
}

function currentUser(){
  return db.usuarios.find(u=>u.id===state.currentUserId) || db.usuarios[0];

  return rows.sort((a,b)=> new Date(a.parcela.dataVencimento)-new Date(b.parcela.dataVencimento)).slice(0,6);

function statusBadge(parcela){

function renderCobranca(){
  if(state.cobrancaFlow){ return renderTapFlow(); }
  const pendentesHoje = [];
  emprestimosFiltrados().forEach(emp=>{
    const p = proximaParcela(emp);
    if(p) pendentesHoje.push({emp, parcela:p, cliente: db.clientes.find(c=>c.id===emp.clienteId)});
  });
  pendentesHoje.sort((a,b)=> new Date(a.parcela.dataVencimento)-new Date(b.parcela.dataVencimento));
  return `
  <div class="card" style="margin-bottom:20px; background:linear-gradient(120deg,var(--verde-900),#0C3A2C); color:#fff; border:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
      <div>
        <div style="font-size:13px;color:rgba(255,255,255,.65);margin-bottom:4px;">Toque no cliente para iniciar a cobrança</div>
        <div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:700;">${pendentesHoje.length} clientes com parcela pendente</div>
      </div>
      <div style="display:flex; gap:10px;">
        <div style="text-align:center;"><div class="display" style="font-size:22px;font-weight:800;">${countAtrasados()}</div><div style="font-size:11px;color:rgba(255,255,255,.6);">Atrasados</div></div>
        <div style="width:1px;background:rgba(255,255,255,.2);"></div>
        <div style="text-align:center;"><div class="display" style="font-size:22px;font-weight:800;">${fmtMoney(db.pagamentos.filter(p=> new Date(p.data).toDateString()===new Date().toDateString()).reduce((s,p)=>s+p.valor,0)).replace('R$ ','')}</div><div style="font-size:11px;color:rgba(255,255,255,.6);">Cobrado hoje</div></div>
      </div>
    </div>
  </div>
  <div class="grid client-cards">
    ${pendentesHoje.map(row=>{
      const atrasada = new Date(row.parcela.dataVencimento) < new Date();
      return `
      <div class="client-card" data-action="cobrarRapido" data-emp="${row.emp.id}" data-parc="${row.parcela.id}">
        <div class="client-card-top">
          <div class="avatar-tiny" style="width:42px;height:42px;font-size:14px;background:${avatarColor(row.cliente.nome)}">${initials(row.cliente.nome)}</div>
          <div style="flex:1;">
            <div class="client-card-name">${esc(row.cliente.nome)}</div>
            <div class="client-card-id">Parcela ${row.parcela.numero} · vence ${fmtDateShort(row.parcela.dataVencimento)}</div>
          </div>
          ${atrasada ? `<span class="badge badge-bad"><span class="badge-dot"></span>Atraso</span>` : `<span class="badge badge-warn"><span class="badge-dot"></span>Hoje</span>`}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
          <div class="mono" style="font-size:19px;font-weight:700;">${fmtMoney(row.parcela.valor)}</div>
          <div class="btn btn-primary btn-sm">${ICONS.charge} Cobrar</div>
        </div>
      </div>`;
    }).join('') || `<div class="empty-state" style="grid-column:1/-1;">${ICONS.check}<h3>Tudo cobrado por aqui!</h3><p>Não há parcelas pendentes no momento.</p></div>`}
  </div>`;
}

function renderTapFlow(){
  const {step, emp, parcela, cliente} = state.cobrancaFlow;
  let inner = '';
  if(step===1){
    inner = `
      <div class="tap-avatar" style="background:${avatarColor(cliente.nome)}">${initials(cliente.nome)}</div>
      <div style="font-weight:700;font-size:16px;">${esc(cliente.nome)}</div>
      <div class="tap-sub">Parcela ${parcela.numero} · vence ${fmtDate(parcela.dataVencimento)}</div>
      <div class="tap-amount mono">${fmtMoney(parcela.valor - parcela.pago)}</div>
      <div class="tap-sub">Valor a cobrar (toque 1 de 3)</div>
      <button class="tap-btn" data-action="tapNext">${ICONS.check} Confirmar valor</button>
      <button class="tap-btn secondary" data-action="tapValorExtra">Registrar pagamento diferente</button>
    `;
  } else if(step===2){
    inner = `
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Forma de pagamento</div>
      <div class="tap-sub">Toque 2 de 3</div>
      <div class="tap-methods">
        ${['dinheiro','pix','cartao'].map(m=>`
          <div class="tap-method ${state.cobrancaFlow.meio===m?'active':''}" data-action="setMeio" data-meio="${m}">
            ${m==='dinheiro'?ICONS.cash:m==='pix'?ICONS.pix:ICONS.card}
            <span>${m==='dinheiro'?'Dinheiro':m==='pix'?'Pix':'Cartão'}</span>
          </div>`).join('')}
      </div>
      <button class="tap-btn" data-action="tapNext" ${!state.cobrancaFlow.meio?'style="opacity:.5;pointer-events:none;"':''}>${ICONS.check} Confirmar recebimento</button>
      <button class="tap-btn secondary" data-action="tapBack">Voltar</button>
    `;
  } else {
    inner = `
      <div class="tap-success">${ICONS.check}</div>
      <div style="font-weight:700;font-size:17px;">Pagamento registrado!</div>
      <div class="tap-sub">${fmtMoney(state.cobrancaFlow.valorFinal)} recebido de ${esc(cliente.nome)}</div>
      <button class="tap-btn" data-action="tapImprimir">${ICONS.receipts} Ver / imprimir recibo</button>
      <button class="tap-btn secondary" data-action="tapWhats">${ICONS.whatsapp} Enviar por WhatsApp</button>
      <button class="tap-btn secondary" data-action="tapFechar">Concluir</button>
    `;
  }
  return `
  <div style="max-width:420px;margin:10px auto;">
    <div class="card tap-flow">
      <div class="tap-dots">
        <div class="tap-dot ${step>=1?'done':''} ${step===1?'current':''}"></div>
        <div class="tap-dot ${step>=2?'done':''} ${step===2?'current':''}"></div>
        <div class="tap-dot ${step>=3?'done':''} ${step===3?'current':''}"></div>
      </div>
      ${inner}
    </div>
    ${step<3 ? `<div style="text-align:center;margin-top:14px;"><button class="btn btn-ghost btn-sm" data-action="tapCancelar">Cancelar cobrança</button></div>` : ''}
  </div>`;
}

/* ================= MODALS ================= */
function renderModal(){

      <div class="form-divider">${ICONS.clients} Dados pessoais</div>

        <div class="field"><label>CPF</label><input id="mCPF" placeholder="000.000.000-00" value="${esc(d.mCPF||'')}"></div>

        </div>
        <div class="field"><label>Carteira</label>
          <select id="mCarteira">${db.carteiras.map(c=>opt(c.id, d.mCarteira||(state.carteiraFiltro!=='todas'?state.carteiraFiltro:db.carteiras[0].id), esc(c.nome))).join('')}</select>

      <div class="form-divider">${ICONS.shield} Garantia</div>

        <div class="seg">
          <button type="button" data-action="setGarantiaTipo" data-val="fiador" class="${gt==='fiador'?'active':''}">Fiador</button>

        <div class="field"><label>Nome do fiador</label><input id="mFiadorNome" placeholder="Nome completo" value="${esc(d.mFiadorNome||'')}"></div>
        <div class="field-row">
          <div class="field"><label>CPF do fiador</label><input id="mFiadorCPF" placeholder="000.000.000-00" value="${esc(d.mFiadorCPF||'')}"></div>
          <div class="field"><label>Celular do fiador</label><input id="mFiadorCel" placeholder="(11) 90000-0000" value="${esc(d.mFiadorCel||'')}"></div>
        </div>
      ` : `
        <div class="field"><label>Tipo de bem</label>
          <select id="mBemTipo">${['Moto','Carro','Ouro'].map(b=>opt(b,d.mBemTipo||'Moto')).join('')}</select>

        </div>
      `}

      <div class="form-divider">${ICONS.alert} Contratos com terceiros</div>

        <label>Cliente possui outros contratos de empréstimos com terceiros?</label>

          <button type="button" data-action="setOutrosContratos" data-val="nao" class="${oc==='nao'?'active':''}">Não</button>
          <button type="button" data-action="setOutrosContratos" data-val="sim" class="${oc==='sim'?'active':''}">Sim</button>

      <div class="field-row">
        <div class="field"><label>Valor contratado (R$)</label><input id="mCapitalCli" type="number" placeholder="1000" value="${d.mCapitalCli||''}"></div>
        <div class="field"><label>Porcentagem do juros (% a.m.)</label><input id="mJurosCli" type="number" step="0.1" placeholder="15" value="${d.mJurosCli||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Valor Juros</label>
          <input id="valorJurosDisplay" class="mono" readonly value="${fmtMoney(valorJurosAtual)}" style="background:var(--creme-50);">

      <div class="field-row">

          <input id="valorParcelaDisplay" class="mono" readonly value="${fmtMoney(valorParcelaAtual)}" style="background:var(--verde-100); font-weight:700; color:var(--verde-700); border-color:var(--verde-500);">
        </div>
      </div>
      <div class="field-hint" style="margin:-8px 0 16px;">Valor da parcela = (valor contratado ÷ parcelas) + valor do juros calculado sobre o contratado.</div>
      <div class="field"><label>Forma de pagamento</label>
        <div class="seg" id="segFormaPagCli">

      </div>
    `;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Cancelar</button><button class="btn btn-primary" data-action="salvarCliente">${ICONS.check} ${isEdit?'Salvar alterações':'Cadastrar cliente'}</button>`;
  }
  else if(name==='novoEmprestimo'){
    const empExist = payload && payload.editId ? db.emprestimos.find(e=>e.id===payload.editId) : null;
    title = empExist ? 'Editar empréstimo' : 'Novo empréstimo';
    body=`
      <div class="field"><label>Cliente</label>
        <select id="mCliente" ${empExist?'disabled':''}>${db.clientes.map(c=>`<option value="${c.id}" ${empExist&&empExist.clienteId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>

      <div class="field-row">
        <div class="field"><label>Capital emprestado (R$)</label><input id="mCapital" type="number" placeholder="1000000" value="${empExist?empExist.capital:1000}"></div>
        <div class="field"><label>Taxa de juros (% ao mês)</label><input id="mTaxa" type="number" step="0.1" value="${empExist?empExist.taxaMensal:15}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Prazo (dias)</label><input id="mPrazo" type="number" value="${empExist?empExist.prazoDias:30}"></div>
        <div class="field"><label>Início</label><input id="mInicio" type="date" value="${empExist? new Date(empExist.dataInicio).toISOString().slice(0,10) : new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Frequência de cobrança</label>
        <div class="seg" id="segFreq">

      <div class="field"><label>Modo de juros</label>

        <div class="field-hint">Fixo: juros sobre capital original. Recalculado: juros sobre saldo devedor. Capitalização: tabela Price (parcelas fixas, juros compostos).</div>

    const g = cli.garantiaTipo;
    body=`
      <div style="display:flex;gap:16px;margin-bottom:18px;">
        <div class="avatar-tiny" style="width:52px;height:52px;font-size:17px;background:${avatarColor(cli.nome)}">${initials(cli.nome)}</div>
        <div>
          <div style="font-size:12.5px;color:var(--tinta-600);">CPF ${esc(cli.doc||'—')}${cli.rg?' · RG '+esc(cli.rg):''} · ${esc(cli.tel)}</div>

      <div class="card" style="margin-bottom:12px;padding:14px;">
        <div class="section-title" style="margin-bottom:8px;">${ICONS.shield} Garantia</div>
        ${g==='fiador' && cli.fiador ? `
          <div style="font-size:13px;"><b>Fiador:</b> ${esc(cli.fiador.nome)}</div>
          <div style="font-size:12.5px;color:var(--tinta-600);">CPF ${esc(cli.fiador.cpf)} · ${esc(cli.fiador.celular)}</div>
        ` : g==='bens' && cli.bem ? `
          <div style="font-size:13px;"><b>${esc(cli.bem.tipo)}:</b> ${esc(cli.bem.marca)} ${esc(cli.bem.modelo)}</div>
          <div style="font-size:12.5px;color:var(--tinta-600);">Ano ${esc(cli.bem.ano)} · Cor ${esc(cli.bem.cor)}</div>

      ${cli.outrosContratos && cli.outrosContratos.possui ? `
      <div class="card" style="margin-bottom:12px;padding:14px;border-color:var(--laranja-500);">
        <div class="section-title" style="margin-bottom:6px;">${ICONS.alert} Possui contrato com terceiros</div>
        <div style="font-size:13px;">${esc(cli.outrosContratos.nome)} · ${esc(cli.outrosContratos.celular)}</div>

      ${cli.anexo ? `
      <div class="card" style="margin-bottom:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">${ICONS.receipts}<span style="font-size:13px;font-weight:600;">${esc(cli.anexo.nome)}</span></div>

      ${cli.condicoesIniciais ? `
      <div class="card" style="margin-bottom:12px;padding:14px;">
        <div class="section-title" style="margin-bottom:8px;">Condições contratadas</div>

        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Valor de Juros Total</span><b class="mono">${fmtMoney(cli.condicoesIniciais.valorJurosTotal)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Quantidade de parcelas</span><b>${cli.condicoesIniciais.qtdParcelas}x</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Valor da parcela</span><b class="mono">${fmtMoney(cli.condicoesIniciais.valorParcela)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Juros de atraso mensal</span><b>${cli.condicoesIniciais.jurosAtrasoMensal}%</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;"><span>Forma de pagamento</span><b>${FREQ_LABEL[cli.condicoesIniciais.formaPagamento]||cli.condicoesIniciais.formaPagamento}</b></div>
      </div>` : ''}

      ${emp.map(e=>`
        <div class="card" style="margin-bottom:10px;padding:14px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span class="badge badge-neutral">${MODO_LABEL[e.modo]}</span>
            ${e.status==='quitado'? `<span class="badge badge-ok"><span class="badge-dot"></span>Quitado</span>`:`<span class="badge badge-info"><span class="badge-dot"></span>Ativo</span>`}
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Capital</span><b class="mono">${fmtMoney(e.capital)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Saldo devedor</span><b class="mono">${fmtMoney(saldoDevedor(e))}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>Progresso</span><b>${progressoEmprestimo(e).toFixed(0)}%</b></div>
        </div>
      `).join('') || `<p style="color:var(--tinta-600);font-size:13px;">Nenhum empréstimo cadastrado para este cliente.</p>`}
    `;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Fechar</button><button class="btn btn-primary" data-action="novoEmprestimoFor" data-id="${cli.id}">${ICONS.plus} Novo empréstimo</button>`;
  }
  else if(name==='verEmprestimo'){
    const emp = db.emprestimos.find(e=>e.id===payload.id);
    const cli = db.clientes.find(c=>c.id===emp.clienteId);
    title='Contrato #'+emp.id.slice(-5).toUpperCase()+' — '+cli.nome;
    body=`
      <div class="field-row" style="margin-bottom:6px;">
        <div><div style="font-size:11px;color:var(--tinta-600);">Capital</div><div class="mono" style="font-weight:700;">${fmtMoney(emp.capital)}</div></div>
        <div><div style="font-size:11px;color:var(--tinta-600);">Saldo devedor</div><div class="mono" style="font-weight:700;">${fmtMoney(saldoDevedor(emp))}</div></div>
      </div>
      <div class="field" style="margin-top:14px;">
        <label>Pagamento extra (abate capital e recalcula parcelas)</label>
        <div style="display:flex;gap:8px;">
          <input id="mExtra" type="number" placeholder="Valor em R$">
          <button class="btn btn-primary btn-sm" data-action="pagarExtra" data-id="${emp.id}">Aplicar</button>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:14px;max-height:280px;overflow-y:auto;">
        <table>
          <thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${emp.parcelas.map(p=>`
              <tr>
                <td>${p.numero}</td>
                <td>${fmtDateShort(p.dataVencimento)}</td>
                <td class="mono">${fmtMoney(p.valor)}</td>
                <td>${statusBadge(p)}</td>
                <td>${p.status!=='pago' ? `<button class="btn btn-ghost btn-sm" data-action="pagarParcela" data-emp="${emp.id}" data-parc="${p.id}">Pagar</button>` : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Fechar</button>`;
  }
  else if(name==='verRecibo'){
    const pag = db.pagamentos.find(p=>p.id===payload.id);
    const cli = db.clientes.find(c=>c.id===pag.clienteId);
    const emp = db.emprestimos.find(e=>e.id===pag.emprestimoId);
    title='Recibo de pagamento';
    body=`
      <div class="receipt" id="reciboPrint">
        <div class="receipt-logo">${esc(db.config.nomeEmpresa)}</div>
        <div class="receipt-sub">Comprovante de pagamento</div>
        <div class="receipt-row"><span>Cliente</span><b>${esc(cli.nome)}</b></div>
        <div class="receipt-row"><span>Documento</span><span>${esc(cli.doc)}</span></div>
        <div class="receipt-row"><span>Contrato</span><span>#${emp.id.slice(-5).toUpperCase()}</span></div>
        <div class="receipt-row"><span>Data</span><span>${fmtDate(pag.data)}</span></div>
        <div class="receipt-row"><span>Forma de pagamento</span><span>${meioLabel(pag.meio)}</span></div>
        <div class="receipt-row total"><span>Total pago</span><span class="mono">${fmtMoney(pag.valor)}</span></div>
        <div class="receipt-sign">Assinatura digital do cliente<br>✓ confirmada em ${fmtDate(pag.data)}</div>
      </div>
    `;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Fechar</button><button class="btn btn-ghost" data-action="printRecibo">${ICONS.pdf} Imprimir/PDF</button><button class="btn btn-primary" data-action="whatsRecibo" data-id="${pag.id}">${ICONS.whatsapp} Enviar</button>`;
  }
  else if(name==='addFeriado'){
    title='Bloquear data de cobrança';
    body=`<div class="field"><label>Data</label><input id="mFeriado" type="date"></div>`;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Cancelar</button><button class="btn btn-primary" data-action="salvarFeriado">${ICONS.check} Bloquear data</button>`;
  }
  else if(name==='trocarUsuario'){
    const cu = currentUser();
    title = isAdmin() ? 'Conta' : 'Minha conta';
    const p = PERFIS[cu.perfil] || PERFIS['Cobrador'];
    body=`
      <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--creme-50);border-radius:12px;margin-bottom:18px;">
        <div class="avatar-tiny" style="width:42px;height:42px;background:${avatarColor(cu.nome)}; position:relative;">${initials(cu.nome)}<span class="presence-dot ${estaOnline(cu)?'presence-online':'presence-offline'}"></span></div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;">${esc(cu.nome)}</div>
          <div style="font-size:12px;color:var(--tinta-600);">${esc(cu.email)}</div>
        </div>
        <span class="badge" style="background:${p.bg};color:${p.cor};">${esc(cu.perfil)}</span>
      </div>
      ${isAdmin() ? `
      <p style="font-size:12.5px;color:var(--tinta-600);margin-bottom:14px;">Visualizar como (apenas para teste — não altera a senha de ninguém):</p>
      ${db.usuarios.map(u=>{
        const pu = PERFIS[u.perfil] || PERFIS['Cobrador'];
        const ativoAtual = u.id===state.currentUserId;
        const pres = statusPresenca(u);
        return `
        <div data-action="selecionarUsuario" data-id="${u.id}" style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1.5px solid ${ativoAtual?'var(--verde-600)':'var(--borda)'};background:${ativoAtual?'var(--verde-100)':'#fff'};margin-bottom:8px;cursor:pointer;">
          <div class="avatar-tiny" style="width:36px;height:36px;background:${avatarColor(u.nome)}; position:relative;">${initials(u.nome)}<span class="presence-dot ${estaOnline(u)?'presence-online':'presence-offline'}"></span></div>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:13.5px;">${esc(u.nome)}</div>
            <div style="font-size:11.5px;color:${estaOnline(u)?'var(--verde-700)':'var(--tinta-600)'};font-weight:${estaOnline(u)?'600':'400'};">${pres.texto}</div>
          </div>
          <span class="badge" style="background:${pu.bg};color:${pu.cor};">${esc(u.perfil)}</span>
          ${ativoAtual ? ICONS.check : ''}
        </div>`;
      }).join('')}
      ` : ''}
    `;
    footer=`<button class="btn btn-ghost" data-action="closeModal">Fechar</button><button class="btn btn-danger-ghost" data-action="sairSessao">${ICONS.x} Sair</button>`;
  }

  return `
  <div class="modal-overlay no-print" data-action="overlayClose">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close" data-action="closeModal">${ICONS.x}</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">${footer}</div>
    </div>
  </div>`;
}

/* ================= EVENTOS ================= */
function afterRender(){
  if(!window._docListenersInit){
    document.addEventListener('click', onDocClick);
    document.addEventListener('input', onDocInput);
    window._docListenersInit = true;
  }
  if(state.page==='dashboard') setTimeout(drawDashboardCharts,0);
  if(state.page==='relatorios') setTimeout(drawRelatorioCharts,0);
  const segFreq = document.getElementById('segFreq');
  const segModo = document.getElementById('segModo');
  const segFormaPagCli = document.getElementById('segFormaPagCli');
  [segFreq, segModo, segFormaPagCli].forEach(seg=>{
    if(!seg) return;
    seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    }));
  });
  const fileLogo = document.getElementById('fileLogo');
  const btnUpload = document.getElementById('btnUploadLogo');
  if(btnUpload) btnUpload.addEventListener('click', ()=> fileLogo.click());
  if(fileLogo) fileLogo.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ db.config.logoDataUrl = reader.result; render(); toast('Logo atualizada'); };
    reader.readAsDataURL(file);
  });
  const fileAnexo = document.getElementById('fileAnexoCliente');
  const btnAnexar = document.getElementById('btnAnexarCliente');
  if(btnAnexar) btnAnexar.addEventListener('click', ()=> fileAnexo.click());
  if(fileAnexo) fileAnexo.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const tiposOk = ['image/jpeg','application/pdf'];
    if(!tiposOk.includes(file.type)){ toast('Envie apenas arquivos JPEG ou PDF', ICONS.alert); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      collectClienteDraft();
      state.formAnexo = {nome:file.name, tipo:file.type, dataUrl:reader.result};
      render(); toast('Comprovante anexado');
    };
    reader.readAsDataURL(file);
  });
  const perfilSelect = document.getElementById('mUsrPerfil');
  if(perfilSelect) perfilSelect.addEventListener('change', ()=>{
    const perfil = perfilSelect.value;
    state.usrFormDraft.mUsrPerfil = perfil;
    const hint = document.getElementById('perfilHint');
    const campoCobrador = document.getElementById('campoCobradorVinculo');
    if(hint) hint.textContent = PERFIS[perfil].desc;
    if(campoCobrador) campoCobrador.style.display = perfil==='Cobrador' ? 'block' : 'none';
  });
  const carteiraFiltroSelect = document.getElementById('carteiraFiltroSelect');
  if(carteiraFiltroSelect) carteiraFiltroSelect.addEventListener('change', (e)=>{
    state.carteiraFiltro = e.target.value;
    render();
  });
}

function onDocInput(e){
  if(e.target.id==='globalSearch') state.clientesBusca = e.target.value;
  if(e.target.id==='globalSearch' && state.page==='clientes'){
    document.getElementById('pageContent').innerHTML = renderPage();
  }
  if(e.target.id==='carteiraFiltroSelect'){
    state.carteiraFiltro = e.target.value;
    render();
    return;
  }
  if(['mCapitalCli','mJurosCli','mQtdParcelas'].includes(e.target.id)){
    const capital = parseFloat(document.getElementById('mCapitalCli').value) || 0;
    const juros = parseFloat(document.getElementById('mJurosCli').value) || 0;
    const qtd = parseInt(document.getElementById('mQtdParcelas').value) || 1;
    const valorJuros = round2(capital * (juros/100));
    const valorJurosTotal = round2(valorJuros * qtd);
    const valorParcela = round2((capital/qtd) + valorJuros);
    const dJ = document.getElementById('valorJurosDisplay');
    const dJT = document.getElementById('valorJurosTotalDisplay');
    const dP = document.getElementById('valorParcelaDisplay');
    if(dJ) dJ.value = fmtMoney(valorJuros);
    if(dJT) dJT.value = fmtMoney(valorJurosTotal);
    if(dP) dP.value = fmtMoney(valorParcela);
  }
}

function onDocClick(e){
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ navigate(navEl.dataset.nav); return; }

  const overlay = e.target.closest('[data-action="overlayClose"]');
  if(overlay && e.target===overlay){ closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'novoCliente':
      state.formGarantiaTipo='fiador'; state.formOutrosContratos='nao'; state.formAnexo=null; state.formDraft={}; state.editingClienteId=null;
      openModal('novoCliente');
      break;
    case 'editarCliente': {
      const cli = db.clientes.find(c=>c.id===el.dataset.id);
      state.editingClienteId = cli.id;
      state.formGarantiaTipo = cli.garantiaTipo || 'fiador';
      state.formOutrosContratos = (cli.outrosContratos && cli.outrosContratos.possui) ? 'sim' : 'nao';
      state.formAnexo = cli.anexo || null;
      const ci = cli.condicoesIniciais || {};
      state.formDraft = {
        mNome: cli.nome, mCPF: cli.doc==='—'?'':cli.doc, mRG: cli.rg==='—'?'':cli.rg, mTel: cli.tel==='—'?'':cli.tel,
        mEndereco: cli.endereco==='—'?'':cli.endereco, mCobrador: cli.cobradorId, mCarteira: cli.carteiraId,
        mFiadorNome: cli.fiador?cli.fiador.nome:'', mFiadorCPF: cli.fiador?cli.fiador.cpf:'', mFiadorCel: cli.fiador?cli.fiador.celular:'',
        mBemTipo: cli.bem?cli.bem.tipo:'Moto', mBemMarca: cli.bem?cli.bem.marca:'', mBemModelo: cli.bem?cli.bem.modelo:'', mBemAno: cli.bem?cli.bem.ano:'', mBemCor: cli.bem?cli.bem.cor:'',
        mOutroNome: (cli.outrosContratos&&cli.outrosContratos.nome)||'', mOutroCel: (cli.outrosContratos&&cli.outrosContratos.celular)||'',
        mCapitalCli: ci.valorContratado||'', mJurosCli: ci.porcentagemJuros||'', mQtdParcelas: ci.qtdParcelas||1,
        mDataPagamento: ci.dataPagamento||'', mJurosAtraso: ci.jurosAtrasoMensal!==undefined?ci.jurosAtrasoMensal:30,
        formaPagCli: ci.formaPagamento||'diario',
      };
      openModal('novoCliente', {editId: cli.id});
      break;
    }
    case 'excluirCliente': {
      const cli = db.clientes.find(c=>c.id===el.dataset.id);
      const empsCli = db.emprestimos.filter(e=>e.clienteId===cli.id);
      const pagsCli = db.pagamentos.filter(p=>p.clienteId===cli.id);
      const msg = empsCli.length
        ? `Isso também excluirá ${empsCli.length} empréstimo(s) e ${pagsCli.length} pagamento(s) associados a ${cli.nome}. Deseja continuar?`
        : `Excluir o cliente ${cli.nome}?`;
      if(!confirm(msg)) return;
      if(FIREBASE_ATIVO){
        empsCli.forEach(e=>fbDelete('emprestimos', e.id));
        pagsCli.forEach(p=>fbDelete('pagamentos', p.id));
        fbDelete('clientes', cli.id);
      }
      db.emprestimos = db.emprestimos.filter(e=>e.clienteId!==cli.id);
      db.pagamentos = db.pagamentos.filter(p=>p.clienteId!==cli.id);
      db.clientes = db.clientes.filter(c=>c.id!==cli.id);
      toast('Cliente excluído');
      render();
      break;
    }
    case 'setGarantiaTipo': collectClienteDraft(); state.formGarantiaTipo = el.dataset.val; render(); break;
    case 'setOutrosContratos': collectClienteDraft(); state.formOutrosContratos = el.dataset.val; render(); break;
    case 'removeAnexoCliente': collectClienteDraft(); state.formAnexo = null; render(); break;
    case 'novoEmprestimo': state.editingEmprestimoId=null; openModal('novoEmprestimo'); break;
    case 'editarEmprestimo': state.editingEmprestimoId = el.dataset.id; openModal('novoEmprestimo', {editId: el.dataset.id}); break;
    case 'excluirEmprestimo': {
      const emp = db.emprestimos.find(e=>e.id===el.dataset.id);
      const cli = db.clientes.find(c=>c.id===emp.clienteId);
      if(!confirm('Excluir o empréstimo de '+(cli?cli.nome:'cliente')+'? Os pagamentos vinculados também serão removidos.')) return;
      const pagsDoEmp = db.pagamentos.filter(p=>p.emprestimoId===emp.id);
      if(FIREBASE_ATIVO){ pagsDoEmp.forEach(p=>fbDelete('pagamentos', p.id)); fbDelete('emprestimos', emp.id); }
      db.pagamentos = db.pagamentos.filter(p=>p.emprestimoId!==emp.id);
      db.emprestimos = db.emprestimos.filter(e=>e.id!==emp.id);
      toast('Empréstimo excluído');
      render();
      break;
    }
    case 'novoCobrador': openModal('novoCobrador'); break;
    case 'editarCobrador': openModal('novoCobrador', {editId: el.dataset.id}); break;
    case 'excluirCobrador': {
      const col = db.cobradores.find(c=>c.id===el.dataset.id);
      const qtdClientes = db.clientes.filter(c=>c.cobradorId===col.id).length;
      const msg = qtdClientes
        ? `${col.nome} está vinculado(a) a ${qtdClientes} cliente(s). Excluir o cobrador removerá essa atribuição (os clientes não serão apagados). Deseja continuar?`
        : `Excluir o cobrador ${col.nome}?`;
      if(!confirm(msg)) return;
      const clientesAfetados = db.clientes.filter(c=>c.cobradorId===col.id);
      db.clientes.forEach(c=>{ if(c.cobradorId===col.id) c.cobradorId=null; });
      db.cobradores = db.cobradores.filter(c=>c.id!==col.id);
      if(FIREBASE_ATIVO){ clientesAfetados.forEach(c=>fbUpdate('clientes', c.id, {cobradorId:null})); fbDelete('cobradores', col.id); }
      toast('Cobrador excluído');
      render();
      break;
    }
    case 'novoUsuario':
      if(!isAdmin()){ toast('Apenas administradores podem gerenciar usuários', ICONS.alert); return; }
      state.editingUsuarioId=null; state.usrFormDraft={}; state.usrAcessoTodas=true; state.usrCarteirasSelecionadas=[];
      openModal('novoUsuario');
      break;
    case 'editarUsuario': {
      if(!isAdmin()){ toast('Apenas administradores podem gerenciar usuários', ICONS.alert); return; }
      const u = db.usuarios.find(x=>x.id===el.dataset.id);
      state.editingUsuarioId = u.id;

      if(db.carteiras.length<=1){ toast('É necessário manter ao menos uma carteira', ICONS.alert); return; }
      if(qtd>0){ toast('Não é possível excluir: há '+qtd+' cliente(s) nesta carteira. Mova-os antes de excluir.', ICONS.alert); return; }
      if(!confirm('Excluir a carteira "'+cart.nome+'"?')) return;
      db.carteiras = db.carteiras.filter(c=>c.id!==cart.id);
      if(FIREBASE_ATIVO) fbDelete('carteiras', cart.id);
      if(state.carteiraFiltro===cart.id) state.carteiraFiltro='todas';
      toast('Carteira excluída');
      render();
      break;
    }
    case 'exportCSV': {
      let csv = 'Cliente,Contrato,Data,Meio,Valor\\n';
      db.pagamentos.filter(p=>p.parcelaId).forEach(p=>{
        const cli = db.clientes.find(c=>c.id===p.clienteId);
        csv += `"${cli.nome}","${p.emprestimoId}","${fmtDate(p.data)}","${meioLabel(p.meio)}","${p.valor.toFixed(2)}"\\n`;
      });
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'cobrancas_'+new Date().toISOString().slice(0,10)+'.csv';
      link.click();
      toast('CSV exportado');
      break;
    }
    case 'exportPDFRelatorio': window.print(); break;
  }
}

/* ================= CHARTS ================= */
let _charts = {};
function destroyChart(id){ if(_charts[id]){ _charts[id].destroy(); delete _charts[id]; } }

function drawDashboardCharts(){
  const ctx = document.getElementById('chartArrecadacao');
  if(!ctx) return;
  destroyChart('arrecadacao');
  const days = [...Array(14)].map((_,i)=> addDays(new Date(), -13+i));
  const totals = days.map(d=> db.pagamentos.filter(p=> new Date(p.data).toDateString()===new Date(d).toDateString()).reduce((s,p)=>s+p.valor,0));
  _charts.arrecadacao = new Chart(ctx, {
    type:'bar',
    data:{ labels: days.map(d=>fmtDateShort(d)), datasets:[{ data: totals, backgroundColor:'#0E9B76', borderRadius:6, maxBarThickness:22 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#EEF2EE'}, ticks:{callback:v=>'R$'+(v/1000).toFixed(0)+'k'}}, x:{grid:{display:false}} } }
  });
}
function drawRelatorioCharts(){
  const c1 = document.getElementById('chartMensal');
  if(c1){
    destroyChart('mensal');
    const meses = ['Fev','Mar','Abr','Mai','Jun','Jul'];
    _charts.mensal = new Chart(c1, {
      type:'line',
      data:{ labels: meses, datasets:[{ label:'Arrecadado', data:[18000,24500,21000,27800,31200, db.pagamentos.reduce((s,p)=>s+p.valor,0)], borderColor:'#0E9B76', backgroundColor:'rgba(14,155,118,.12)', fill:true, tension:.35, pointRadius:3 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#EEF2EE'}}, x:{grid:{display:false}} } }
    });
  }
  const c2 = document.getElementById('chartModos');
  if(c2){
    destroyChart('modos');
    const counts = {fixo:0, recalculado:0, capitalizacao:0};
    db.emprestimos.forEach(e=> counts[e.modo]++);
    _charts.modos = new Chart(c2, {
      type:'doughnut',
      data:{ labels:['Fixo','Recalculado','Capitalização'], datasets:[{ data:[counts.fixo,counts.recalculado,counts.capitalizacao], backgroundColor:['#0E9B76','#3E7CFF','#8B6BFF'], borderWidth:0 }]},
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}, cutout:'65%' }
    });
  }
  const c3 = document.getElementById('chartProjecao');
  if(c3){
    destroyChart('projecao');
    const dias = [...Array(30)].map((_,i)=> addDays(new Date(), i));
    let saldo = 0;
    const projecao = dias.map(d=>{
      db.emprestimos.forEach(e=> e.parcelas.forEach(p=>{
        if(p.status!=='pago' && new Date(p.dataVencimento).toDateString()===new Date(d).toDateString()) saldo += p.valor;
      }));
      return saldo;
    });
    _charts.projecao = new Chart(c3, {
      type:'line',
      data:{ labels: dias.map(d=>fmtDateShort(d)), datasets:[{ data: projecao, borderColor:'#FF8C42', backgroundColor:'rgba(255,140,66,.1)', fill:true, tension:.3, pointRadius:0 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#EEF2EE'}, ticks:{callback:v=>'R$'+(v/1000).toFixed(0)+'k'}}, x:{grid:{display:false}, ticks:{maxTicksLimit:8}} } }
    });
  }
}

/* ================= INIT ================= */
if(FIREBASE_ATIVO){
  fbAuth.onAuthStateChanged(fbUser=>{
    if(fbUser){
      processarLoginFirebase(fbUser);
    } else if(state.session){
      pararPresenca(); pararSincroniaFirestore();
      state.session = null;
      render();
    }
  });
  render(); // mostra a tela de login enquanto o Firebase confirma a sessão
} else {
  seedData();
  render();
}
</script>
